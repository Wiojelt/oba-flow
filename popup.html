<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ÖBA Flow</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="glass-shell">
      <header>
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M17 12.5 29.5 24 17 35.5"/>
            <path d="M27 12.5 39.5 24 27 35.5"/>
          </svg>
        </div>
        <div>
          <h1>ÖBA Flow</h1>
        </div>
        <span class="version">3.0</span>
      </header>

      <section class="panel">
        <label class="setting-row">
          <span>
            <strong>Otomatik ilerlet</strong>
          </span>
          <input id="enabled" class="toggle-input" type="checkbox">
          <span class="toggle" aria-hidden="true"></span>
        </label>

        <label class="setting-row">
          <span>
            <strong>Sonraki içeriğe geç</strong>
          </span>
          <input id="courseAdvanceEnabled" class="toggle-input" type="checkbox">
          <span class="toggle" aria-hidden="true"></span>
        </label>
      </section>

      <section class="panel delay-panel">
        <div class="delay-heading">
          <span>
            <strong>Tıklama aralığı</strong>
          </span>
          <output id="delayValue" for="delayMin delayMax">0,5 — 1,5 sn</output>
        </div>
        <div class="dual-range" aria-label="Tıklama gecikmesi aralığı">
          <div class="range-rail" aria-hidden="true"><span id="rangeFill"></span></div>
          <input id="delayMin" class="range range-min" type="range" min="0" max="10" step="0.5" value="0.5" aria-label="En kısa gecikme">
          <input id="delayMax" class="range range-max" type="range" min="0" max="10" step="0.5" value="1.5" aria-label="En uzun gecikme">
        </div>
        <div class="range-labels"><span>0</span><span>5</span><span>10 sn</span></div>
      </section>

      <footer>
        <span class="status-dot"></span>
        <span id="saved" role="status" aria-live="polite">Hazır</span>
        <div class="social">
          <span class="handle">@wiojelt</span>
          <div class="social-links">
            <a class="social-link" href="https://twitter.com/wiojelt" target="_blank" rel="noreferrer" aria-label="Twitter">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2h3.7l-8.1 9.2L24 22h-7.4l-5.8-7.6L4.1 22H.4l8.7-10L0 2h7.6l5.2 6.9L18.9 2Zm-1.3 18.1h2L6.5 3.8H4.4l13.2 16.3Z"/></svg>
            </a>
            <a class="social-link" href="https://github.com/Wiojelt" target="_blank" rel="noreferrer" aria-label="GitHub">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7A11.5 11.5 0 0 0 8.4 23c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0c2.2-1.5 3.2-1.2 3.2-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.8 5.4-5.5 5.7.4.4.8 1.1.8 2.1v3.2c0 .4.2.7.8.6A11.5 11.5 0 0 0 12 .7Z"/></svg>
            </a>
          </div>
        </div>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
